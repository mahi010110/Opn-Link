<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le formateur, nommer un adjoint · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre"><h1 class="barre-titre">Adjoint</h1><span class="mono">BTS SIO 2 · chef</span></header>
<main class="page">
  <section class="bloc">
    <p class="etiquette">Tu invites</p>
    <div class="choix" role="radiogroup" aria-label="Tu invites">
      <label><span class="rond coche"></span>Un formateur</label>
      <label><span class="rond"></span>Le centre</label>
    </div>
  </section>
  <div class="faits-liste">
    <p>Un adjoint publie, fait l’appel, envoie des documents et voit le suivi.</p>
    <p>Nommer, régler et fermer la classe restent au chef.</p>
    <p>Son arrivée passe par ton accord&nbsp;: rien ne se voit avant.</p>
  </div>
  <div class="note-gestes"><button class="btn"><i data-ic="qr-code"></i>Montrer un QR</button></div>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a><button class="touche"><i data-ic="share" data-t="ic-24"></i><span>Envoyer l’invitation</span></button></div>
  <p class="faits"><span>Tout est parti</span></p>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
