<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le formateur, envoyer un document à signer · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre"><h1 class="barre-titre">À signer</h1><span class="mono">BTS SIO 2</span></header>
<main class="page">
  <div class="fichier">
    <i data-ic="file-text" data-t="ic-24"></i>
    <div><b>reglement-interieur.pdf</b><span class="mono">4 pages · 212 Ko</span></div>
    <button class="btn">Changer</button>
  </div>
  <div class="liste">
    <div class="rangee"><div><span class="mono">Pour</span><b>Toute la classe</b><span class="mono">24 apprenants</span></div><button class="btn">Choisir</button></div>
    <div class="rangee"><div><span class="mono">Avant le</span><b>Vendredi 20 novembre</b></div><button class="btn">Changer</button></div>
  </div>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a><button class="touche"><i data-ic="send" data-t="ic-24"></i><span>Envoyer aux 24</span></button></div>
  <p class="faits"><span>Tout est parti</span></p>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
