<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le formateur, créer une classe · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre"><h1 class="barre-titre">Créer une classe</h1></header>
<main class="page">
  <label class="champ-nom">Nom de la classe<input class="champ" value="BTS SIO 2" autocorrect="off" spellcheck="false"></label>
  <label class="champ-nom">Nom du centre<input class="champ" value="Centre Exemple" autocorrect="off" spellcheck="false"></label>
  <section class="bloc">
    <p class="etiquette">Horaires</p>
    <div class="liste">
      <div class="rangee"><div><b>Matin</b></div><span class="horaire"><input class="champ" value="9&nbsp;h&nbsp;00" aria-label="Début du matin"><span>à</span><input class="champ" value="12&nbsp;h&nbsp;30" aria-label="Fin du matin"></span></div>
      <div class="rangee"><div><b>Après-midi</b></div><span class="horaire"><input class="champ" value="13&nbsp;h&nbsp;30" aria-label="Début de l'après-midi"><span>à</span><input class="champ" value="17&nbsp;h&nbsp;00" aria-label="Fin de l'après-midi"></span></div>
    </div>
  </section>
  <p class="mono">Tu seras le chef de la classe.</p>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a><button class="touche"><i data-ic="plus" data-t="ic-24"></i><span>Créer la classe</span></button></div>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
