<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le formateur, un support trop lourd · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre"><h1 class="barre-titre">Support</h1><span class="mono">BTS SIO 2</span></header>
<main class="page">
  <div class="bloc">
    <div class="fichier faux">
      <i data-ic="file" data-t="ic-24"></i>
      <div><b>cours-4-en-video.mp4</b><span class="mono">86 Mo</span></div>
      <button class="btn">Retirer</button>
    </div>
    <p class="erreur"><i data-ic="info-box"></i><span>Trop lourd pour partir d’ici&nbsp;: 1 Mo au plus. Range-le où le centre range ses fichiers, et colle son lien.</span></p>
  </div>
  <label class="champ-nom">Le lien du fichier<input class="champ" value="" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
  <label class="champ-nom">Son titre<input class="champ" value="Vidéo du cours 4"></label>
  <section class="bloc">
    <p class="etiquette">Pour qui</p>
    <div class="choix" role="radiogroup" aria-label="Pour qui">
      <label><span class="rond coche"></span>Toute la classe</label>
      <label><span class="rond"></span>Les responsables seulement</label>
    </div>
  </section>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a><button class="touche attend" disabled><span>Ajouter</span></button></div>
  <p class="faits"><span>Tout est parti</span></p>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
