<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le formateur, vérifier une identité · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre maintenant"><h1 class="barre-titre">Identité</h1><span class="mono">3 à vérifier sur 24</span></header>
<main class="page">
  <h2 class="tres-gros">Chloé Bernard</h2>
  <ol class="pas">
    <li><span class="mono">1</span><span>Regarde sa pièce d’identité</span></li>
    <li><span class="mono">2</span><span>Vise le QR de son téléphone</span></li>
  </ol>
  <div class="viseur" data-decor>
    <div class="viseur-salle"><img src="../images/qr-signature.svg" alt=""></div>
    <i class="viseur-coin hg"></i><i class="viseur-coin hd"></i><i class="viseur-coin bg"></i><i class="viseur-coin bd"></i>
    <p class="viseur-mot">Le QR est dans «&nbsp;Moi&nbsp;», sur son téléphone</p>
  </div>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a></div>
  <p class="faits"><span>Tout est parti</span></p>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
