<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aujourd’hui, apprenant · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body data-onglet="aujourdhui" data-attend="messages">
<template id="ecran">
<div class="page-inner ol-tel">
  <div class="td-head"><h1>Aujourd’hui</h1><div class="td-date">lundi 16&nbsp;novembre</div></div>

  <section class="tranche">
    <h2 class="tr-h"><i data-ic="check" data-t="ic-14"></i> Présence</h2>
    <div class="ol-carte">
      <div class="ol-carte-t">BTS SIO 2, matin</div>
      <div class="act-sub"><span>L’appel est ouvert</span><span>Awa Diallo</span></div>
      <button class="btn btn-primary"><i data-ic="qr-code" data-t="ic-14"></i> Signer ma présence</button>
    </div>
  </section>

  <section class="tranche">
    <h2 class="tr-h"><i data-ic="pen-square" data-t="ic-14"></i> À signer <span class="tr-n">1</span></h2>
    <div class="tr-rows">
      <div class="act-row"><div class="act-in">
        <div class="act-main" role="button" tabindex="0"><b class="act-verb">Règlement intérieur</b><span class="act-sub"><span>Centre Exemple</span><span>reçu ven.&nbsp;13/11</span></span></div>
        <div class="act-btns"><button class="abtn" aria-label="Signer"><i data-ic="pen-square"></i></button></div>
      </div></div>
    </div>
  </section>

  <section class="tranche">
    <h2 class="tr-h"><i data-ic="clipboard-note" data-t="ic-14"></i> À rendre <span class="tr-n">1</span></h2>
    <div class="tr-rows">
      <div class="act-row"><div class="act-in">
        <div class="act-main" role="button" tabindex="0"><b class="act-verb">Convention de stage</b><span class="act-sub"><span>Awa Diallo</span><span>avant ven.&nbsp;20/11</span></span></div>
        <div class="act-btns"><button class="abtn" aria-label="Envoyer"><i data-ic="upload"></i></button></div>
      </div></div>
    </div>
  </section>

  <section class="tranche">
    <h2 class="tr-h"><i data-ic="notes" data-t="ic-14"></i> Annonces <span class="tr-n">1</span></h2>
    <div class="tr-rows">
      <div class="act-row"><div class="act-in">
        <div class="act-main" role="button" tabindex="0"><b class="act-verb">Planning de décembre</b><span class="act-sub"><span>Awa Diallo</span><span>hier, 18&nbsp;h&nbsp;02</span></span></div>
      </div></div>
    </div>
  </section>

  <section class="tranche">
    <h2 class="tr-h"><i data-ic="message-text" data-t="ic-14"></i> Messages <span class="tr-n">1</span></h2>
    <div class="tr-rows">
      <div class="act-row"><div class="act-in">
        <div class="act-main" role="button" tabindex="0"><b class="act-verb">Centre Exemple</b><span class="act-sub"><span>Ton badge t’attend à l’accueil.</span></span></div>
      </div></div>
    </div>
  </section>
</div>

<div class="page-inner page-wide ol-poste">
  <div class="td-head"><h1>Aujourd’hui</h1><div class="td-date">lundi 16&nbsp;novembre</div></div>
  <div class="board td-board">
    <section class="bcol">
      <h2 class="bcol-h"><i data-ic="check" data-t="ic-14"></i> Présence</h2>
      <div class="bcol-rows">
        <div class="ol-carte">
          <div class="ol-carte-t">BTS SIO 2, matin</div>
          <div class="act-sub"><span>L’appel est ouvert</span><span>Awa Diallo</span></div>
          <button class="btn btn-primary"><i data-ic="qr-code" data-t="ic-14"></i> Signer ma présence</button>
        </div>
      </div>
    </section>
    <section class="bcol">
      <h2 class="bcol-h"><i data-ic="pen-square" data-t="ic-14"></i> À signer et à rendre <span class="tr-n">2</span></h2>
      <div class="bcol-rows">
        <div class="act-row"><div class="act-in">
          <div class="act-main" role="button" tabindex="0"><b class="act-verb">Règlement intérieur</b><span class="act-sub"><span>Centre Exemple</span><span>reçu ven.&nbsp;13/11</span></span></div>
          <div class="act-btns"><button class="abtn" aria-label="Signer"><i data-ic="pen-square"></i></button></div>
        </div></div>
        <div class="act-row"><div class="act-in">
          <div class="act-main" role="button" tabindex="0"><b class="act-verb">Convention de stage</b><span class="act-sub"><span>Awa Diallo</span><span>avant ven.&nbsp;20/11</span></span></div>
          <div class="act-btns"><button class="abtn" aria-label="Envoyer"><i data-ic="upload"></i></button></div>
        </div></div>
      </div>
    </section>
    <section class="bcol">
      <h2 class="bcol-h"><i data-ic="notes" data-t="ic-14"></i> Annonces et messages <span class="tr-n">2</span></h2>
      <div class="bcol-rows">
        <div class="act-row"><div class="act-in">
          <div class="act-main" role="button" tabindex="0"><b class="act-verb">Planning de décembre</b><span class="act-sub"><span>Awa Diallo</span><span>hier, 18&nbsp;h&nbsp;02</span></span></div>
        </div></div>
        <div class="act-row"><div class="act-in">
          <div class="act-main" role="button" tabindex="0"><b class="act-verb">Centre Exemple</b><span class="act-sub"><span>Ton badge t’attend à l’accueil.</span></span></div>
        </div></div>
      </div>
    </section>
  </div>
</div>
</template>
<script src="../coque.js"></script>
</body>
</html>
