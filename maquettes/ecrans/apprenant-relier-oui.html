<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'apprenant, accepter l'appareil qui demande · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre maintenant"><h1 class="barre-titre">Relier</h1><span class="mono">à l’instant</span></header>
<main class="page">
  <section class="reponse">
    <i data-ic="laptop" data-t="ic-32"></i>
    <div>
      <h2 class="tres-gros">Un ordinateur demande à se relier</h2>
      <p class="mono">Firefox sur Windows</p>
    </div>
  </section>
  <section class="bloc">
    <p class="etiquette">Son écran montre ce nombre</p>
    <p class="grand-code">48 17</p>
  </section>
  <div class="faits-liste">
    <p>Il aura tes classes, tes messages et tes documents.</p>
    <p>Tu peux le retirer quand tu veux, dans « Moi ».</p>
  </div>
  <div class="note-gestes"><button class="btn">Ce n’est pas moi</button></div>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a><button class="touche"><i data-ic="link" data-t="ic-24"></i><span>Relier cet ordinateur</span></button></div>
  <p class="faits"><span>Rien n’est relié sans ton oui</span></p>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
