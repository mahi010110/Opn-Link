<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'apprenant, sans classe · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre"><h1 class="barre-titre">Opn-Link</h1></header>
<main class="page">
  <section>
    <h2 class="tres-gros">Rejoins ta classe</h2>
    <p class="mono">Le formateur montre le QR de la classe à la salle.</p>
  </section>
  <div class="liste">
    <a class="rangee" href="#"><i data-ic="pencil" data-t="ic-20"></i><div><b>Taper un code</b><span class="mono">celui de ta classe, ou celui d’un autre appareil</span></div><i data-ic="chevron-right"></i></a>
    <a class="rangee" href="#"><i data-ic="key" data-t="ic-20"></i><div><b>J’ai une phrase de secours</b><span class="mono">12 mots, pour reprendre ta place</span></div><i data-ic="chevron-right"></i></a>
  </div>
</main>
<footer class="bas">
  <div class="gestes"><button class="touche"><i data-ic="qr-code" data-t="ic-24"></i><span>Viser le QR de ma classe</span></button></div>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
