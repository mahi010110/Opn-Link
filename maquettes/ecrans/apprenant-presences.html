<!doctype html>
<html lang="fr">
<head>

<body class="tel">
<header class="barre"><h1 class="barre-titre">Mes présences</h1></header>
<main class="page">
  <p class="mono">Ton tuteur voit ces cases et rien d’autre.</p>
  <section class="bloc">
    <p class="etiquette">Cette semaine · 16 au 20 nov.</p>
    <div class="dix" data-cases="f f|f f|e e|e e|e e"></div>
  </section>
  <section class="bloc">
    <p class="etiquette">9 au 13 nov.</p>
    <div class="dix" data-cases="f f|a f|e e|e e|e e"></div>
    <div class="liste">
      <div class="rangee"><div><b>Absence mardi 10, matin</b><span class="mono">pas encore justifiée</span></div></div>
      <div class="rangee gestes-rangee"><button class="btn"><i data-ic="attachment"></i>Justifier</button><button class="btn">C’est une erreur</button></div>
    </div>
  </section>
  <section class="bloc">
    <p class="etiquette">2 au 6 nov.</p>
    <div class="dix" data-cases="f f|f f|e e|e e|e e"></div>
  </section>
  <section class="bloc">
    <p class="etiquette">26 au 30 oct. · pas de cours</p>
    <div class="dix" data-cases="e e|e e|e e|e e|e e"></div>
  </section>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a></div>
  <p class="faits"><span>Tout est parti</span></p>
</footer>
