<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'apprenant, la classe est fermée · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre pas-maintenant"><h1 class="barre-titre">Classe fermée</h1><span class="mono">ven. 2 juil.</span></header>
<main class="page">
  <section class="reponse">
    <i data-ic="download" data-t="ic-32"></i>
    <div>
      <h2 class="tres-gros">Télécharge tes documents</h2>
      <p class="mono">Ils s’effacent le dim. 1er août</p>
    </div>
  </section>
  <div class="liste">
    <div class="rangee"><i data-ic="file-text" data-t="ic-20"></i><div><b>Règlement intérieur, signé</b><span class="mono">PDF · 240 Ko</span></div></div>
    <div class="rangee"><i data-ic="file-text" data-t="ic-20"></i><div><b>Charte informatique, signée</b><span class="mono">PDF · 180 Ko</span></div></div>
    <div class="rangee"><i data-ic="file-text" data-t="ic-20"></i><div><b>Attestation de formation</b><span class="mono">PDF · 96 Ko</span></div></div>
    <div class="rangee"><i data-ic="calendar" data-t="ic-20"></i><div><b>Mes présences</b><span class="mono">PDF · de septembre à juillet</span></div></div>
  </div>
</main>
<footer class="bas">
  <div class="gestes"><button class="touche"><i data-ic="download" data-t="ic-24"></i><span>Tout télécharger</span></button></div>
  <p class="faits"><span>Tout est parti</span></p>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
