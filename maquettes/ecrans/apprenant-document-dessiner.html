<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'apprenant, dessiner sa signature · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre"><h1 class="barre-titre">Signer</h1></header>
<main class="page">
  <section>
    <h2 class="gros">Règlement intérieur</h2>
    <p class="mono">Ta signature vaut aussi pour&nbsp;: Charte informatique</p>
  </section>
  <div class="dessin" aria-label="Dessine ta signature ici">
    <svg viewBox="0 0 320 160" preserveAspectRatio="xMidYMid meet" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M48 104c10-34 22-56 30-56 9 0-6 64 4 64 9 0 14-30 24-30 8 0 2 22 10 22 7 0 12-18 20-18 7 0 4 16 12 16 10 0 16-22 30-24 12-2 6 26 18 24 14-2 26-30 44-34"/>
      <path d="M92 124c40-10 96-14 150-12"/>
    </svg>
  </div>
  <div class="note-gestes"><button class="btn"><i data-ic="undo"></i>Effacer</button><button class="btn">Taper mon nom</button></div>
  <p class="mono">Signé avec la clé de ce téléphone · mar. 17 nov. · 9&nbsp;h&nbsp;14</p>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a><button class="touche"><i data-ic="check" data-t="ic-24"></i><span>Valider</span></button></div>
  <p class="faits"><span>Tout est parti</span></p>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
