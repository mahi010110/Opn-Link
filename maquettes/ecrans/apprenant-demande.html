<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'apprenant, répondre à une demande · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre"><h1 class="barre-titre">Demande</h1><span class="mono">avant ven. 20 nov.</span></header>
<main class="page">
  <h2 class="gros">Attestation de responsabilité civile</h2>
  <article class="note">
    <p class="mono">Awa Diallo · formatrice · lun. 16 nov.</p>
    <p class="lu">Envoie-moi ton attestation, en photo ou en PDF.</p>
  </article>
  <div class="fichier">
    <i data-ic="file-text" data-t="ic-24"></i>
    <div><b>attestation-rc.pdf</b><span class="mono">184 Ko</span></div>
    <button class="btn">Retirer</button>
  </div>
  <div class="note-gestes">
    <button class="btn"><i data-ic="attachment"></i>Joindre</button>
    <button class="btn"><i data-ic="camera"></i>Photo</button>
    <button class="btn"><i data-ic="pencil"></i>Écrire</button>
  </div>
  <p class="mono">Part à&nbsp;: Awa Diallo et le Centre Exemple</p>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a><button class="touche"><i data-ic="send" data-t="ic-24"></i><span>Envoyer</span></button></div>
  <p class="faits"><span>Tout est parti</span></p>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
