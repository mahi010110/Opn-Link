<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C, la semaine · écran de la salle · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
<style>
.c-frise { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 22px 56px 18px; font-family: var(--font-mono); font-size: var(--text-16); color: var(--text-muted); }
.c-frise-barre { position: relative; height: 20px; background: var(--surface-field); border: 1px solid var(--border-field); box-shadow: var(--bevel-field); }
.c-frise-barre::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 2%; margin-left: 3px; background: var(--accent); }
.c-maintenant { position: absolute; left: 2%; top: 26px; font-size: var(--text-14); color: var(--text-body); white-space: nowrap; }
.c-salle .salle-corps { padding-top: 22px; }
.c-salle .salle-qr { height: min(100%, 500px); }
</style>
</head>
<body class="salle c-salle">
<section class="fen fen-pleine">
  <header class="fen-barre active">
    <i data-ic="calendar-weeks" data-t="ic-24"></i>
    <h1 class="fen-titre">Lundi 16 novembre · matin</h1>
    <button class="fen-btn" aria-label="Fermer"><i data-ic="close" data-t="ic-12"></i></button>
  </header>
  <div class="c-frise">
    <span>9&nbsp;h</span>
    <span class="c-frise-barre" role="img" aria-label="Il est 9 h 04, la demi-journée finit à 12 h 30"><span class="c-maintenant">9&nbsp;h&nbsp;04</span></span>
    <span>12&nbsp;h&nbsp;30</span>
  </div>
  <div class="salle-corps">
    <div class="qr-cadre salle-qr"><img src="../images/qr-appel.svg" alt="Le QR de l’appel"></div>
    <div>
      <p class="salle-etiquette">Le code</p>
      <p class="code-geant">482&nbsp;913</p>
      <p class="salle-consigne">Ouvre Opn-Link et vise le QR, ou tape le code.</p>
      <div class="salle-compte">
        <p><b>12</b> présents</p>
        <div class="progres" role="img" aria-label="12 présents sur 18">
          <i class="plein"></i><i class="plein"></i><i class="plein"></i><i class="plein"></i><i class="plein"></i><i class="plein"></i>
          <i class="plein"></i><i class="plein"></i><i class="plein"></i><i class="plein"></i><i class="plein"></i><i class="plein"></i>
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
    </div>
  </div>
  <footer class="fen-etat">
    <span>BTS SIO 2 · Centre Exemple · Awa Diallo</span>
    <span class="vide"></span>
    <button class="btn btn-principal">Clore et signer</button>
  </footer>
</section>
<script src="../maquette.js"></script>
</body>
</html>
