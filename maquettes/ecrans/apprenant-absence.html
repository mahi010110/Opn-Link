<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'apprenant, justifier une absence · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre"><h1 class="barre-titre">Absence</h1><span class="mono">mar. 10 nov. · matin</span></header>
<main class="page">
  <section class="bloc">
    <p class="etiquette">Pourquoi</p>
    <div class="choix" role="radiogroup" aria-label="Pourquoi">
      <label><span class="rond coche"></span>Maladie</label>
      <label><span class="rond"></span>Transport</label>
      <label><span class="rond"></span>Entreprise</label>
      <label><span class="rond"></span>Autre raison</label>
    </div>
  </section>
  <div class="fichier">
    <i data-ic="image" data-t="ic-24"></i>
    <div><b>certificat.jpg</b><span class="mono">240 Ko</span></div>
    <button class="btn">Retirer</button>
  </div>
  <p class="avis"><b>Justificatif médical</b>Il part seulement aux responsables&nbsp;: Awa Diallo et le Centre Exemple. Il s’efface de ton téléphone quand ils l’ont reçu.</p>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a><button class="touche"><i data-ic="send" data-t="ic-24"></i><span>Envoyer aux responsables</span></button></div>
  <p class="faits"><span>Tout est parti</span></p>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
