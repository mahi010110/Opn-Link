<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'apprenant, moi · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre"><h1 class="barre-titre">Moi</h1></header>
<main class="page">
  <div class="liste">
    <div class="rangee"><div><b>Léa Martin</b><span class="mono">le nom que voient les responsables</span></div><button class="btn">Corriger</button></div>
  </div>
  <section class="bloc">
    <p class="etiquette">Mes appareils</p>
    <div class="liste">
      <div class="rangee"><i data-ic="smartphone" data-t="ic-20"></i><div><b>Ce téléphone</b><span class="mono">depuis le mer. 2 sept.</span></div></div>
      <div class="rangee"><div><b>Relier un autre appareil</b></div><i data-ic="chevron-right"></i></div>
    </div>
  </section>
  <section class="bloc">
    <p class="etiquette">Ma phrase de secours</p>
    <div class="liste">
      <div class="rangee"><i data-ic="key" data-t="ic-20"></i><div><b>12 mots, à garder sur papier</b><span class="mono">elle te rend ta place si tu perds ce téléphone</span></div><button class="btn">Voir</button></div>
    </div>
  </section>
  <section class="bloc">
    <p class="etiquette">Thème</p>
    <div class="choix" role="radiogroup" aria-label="Thème">
      <label><span class="rond coche"></span>Comme le téléphone</label>
      <label><span class="rond"></span>Clair</label>
      <label><span class="rond"></span>Sombre</label>
    </div>
  </section>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a></div>
  <p class="faits"><span>Tout est parti</span></p>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
