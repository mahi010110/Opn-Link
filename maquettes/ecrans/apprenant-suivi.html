<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'apprenant, le questionnaire de suivi · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre"><h1 class="barre-titre">Suivi</h1><span class="mono">semaine du 16 nov.</span></header>
<main class="page">
  <h2 class="gros">Ta recherche d’alternance</h2>
  <div class="liste">
    <div class="rangee"><div><b>Candidatures envoyées</b></div><span class="compteur"><button class="btn" aria-label="Une de moins"><i data-ic="minus"></i></button><output>4</output><button class="btn" aria-label="Une de plus"><i data-ic="plus"></i></button></span></div>
    <div class="rangee"><div><b>Réponses reçues</b></div><span class="compteur"><button class="btn" aria-label="Une de moins"><i data-ic="minus"></i></button><output>1</output><button class="btn" aria-label="Une de plus"><i data-ic="plus"></i></button></span></div>
    <div class="rangee"><div><b>Entretiens</b></div><span class="compteur"><button class="btn" aria-label="Un de moins"><i data-ic="minus"></i></button><output>0</output><button class="btn" aria-label="Un de plus"><i data-ic="plus"></i></button></span></div>
  </div>
  <div class="choix" role="radiogroup" aria-label="Où en es-tu">
    <label><span class="rond coche"></span>Ça avance</label>
    <label><span class="rond"></span>Je bloque</label>
    <label><span class="rond"></span>J’ai trouvé</label>
  </div>
  <p class="mono">Part à&nbsp;: Awa Diallo et le Centre Exemple</p>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a><button class="touche"><i data-ic="send" data-t="ic-24"></i><span>Envoyer</span></button></div>
  <p class="faits"><span>Tout est parti</span></p>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
