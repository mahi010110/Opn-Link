<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le formateur, les membres de la classe · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="tel">
<header class="barre"><h1 class="barre-titre">Membres</h1><span class="mono">BTS SIO 2</span></header>
<main class="page">
  <section class="bloc">
    <p class="etiquette">Responsables</p>
    <div class="liste">
      <div class="rangee"><div><b>Awa Diallo</b><span class="mono">formateur · chef</span></div></div>
      <a class="rangee" href="#"><div><b>Julien Morel</b><span class="mono">formateur · adjoint</span></div><i data-ic="chevron-right"></i></a>
      <a class="rangee" href="#"><div><b>Sandrine Robert</b><span class="mono">centre · adjoint</span></div><i data-ic="chevron-right"></i></a>
    </div>
  </section>
  <div class="liste">
    <a class="rangee" href="#"><div><b>24 apprenants</b></div><i data-ic="chevron-right"></i></a>
    <a class="rangee" href="#"><div><b>9 tuteurs</b></div><i data-ic="chevron-right"></i></a>
  </div>
  <div class="note-gestes">
    <button class="btn"><i data-ic="qr-code"></i>Inviter des apprenants</button>
    <button class="btn"><i data-ic="mail"></i>Inviter un tuteur</button>
    <button class="btn"><i data-ic="plus"></i>Nommer un adjoint</button>
  </div>
  <section class="bloc" style="margin-top: 16px">
    <p class="etiquette">La fin</p>
    <div class="note-gestes">
      <button class="btn">Passer la main</button>
      <button class="btn danger">Fermer la classe</button>
    </div>
  </section>
</main>
<footer class="bas">
  <div class="gestes"><a class="btn retour" href="#"><i data-ic="arrow-left" data-t="ic-20"></i>Retour</a></div>
  <p class="faits"><span>Tout est parti</span></p>
</footer>
<script src="../maquette.js"></script>
</body>
</html>
