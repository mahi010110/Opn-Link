<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aujourd’hui, formateur · maquette Opn-Link</title>
<link rel="stylesheet" href="../style.css">
</head>
<body data-onglet="aujourdhui" data-attend="messages">
<template id="ecran">
<div class="page-inner ol-tel">
  <div class="td-head"><h1>Aujourd’hui</h1><div class="td-date">lundi 16&nbsp;novembre</div></div>

  <section class="tranche">
    <h2 class="tr-h"><i data-ic="check" data-t="ic-14"></i> Présence</h2>
    <div class="ol-carte">
      <div class="ol-carte-t">BTS SIO 2, matin</div>
      <div class="act-sub"><span>9&nbsp;h à 12&nbsp;h&nbsp;30</span><span>18&nbsp;apprenants</span></div>
      <button class="btn btn-primary"><i data-ic="qr-code" data-t="ic-14"></i> Lancer l’appel</button>
    </div>
  </section>

  <section class="tranche">
    <h2 class="tr-h"><i data-ic="user-x" data-t="ic-14"></i> Absences <span class="tr-n">1</span></h2>
    <div class="tr-rows">
      <div class="act-row"><div class="act-in">
        <div class="act-main" role="button" tabindex="0"><b class="act-verb">Hugo Lefèvre</b><span class="act-sub"><span>absent ven.&nbsp;13/11, après-midi</span><span>apprenti</span></span></div>
        <div class="act-btns"><button class="abtn" aria-label="Prévenir son entreprise"><i data-ic="mail"></i></button></div>
      </div></div>
    </div>
  </section>

  <section class="tranche">
    <h2 class="tr-h"><i data-ic="clipboard-note" data-t="ic-14"></i> Demandes <span class="tr-n">1</span></h2>
    <div class="tr-rows">
      <div class="act-row"><div class="act-in">
        <div class="act-main" role="button" tabindex="0"><b class="act-verb">Convention de stage</b><span class="act-sub"><span>13&nbsp;sur 18 faites</span><span>avant ven.&nbsp;20/11</span></span></div>
        <div class="act-btns"><button class="abtn" aria-label="Relancer"><i data-ic="bell-ring"></i></button></div>
      </div></div>
    </div>
  </section>

  <section class="tranche">
    <h2 class="tr-h"><i data-ic="message-text" data-t="ic-14"></i> Messages <span class="tr-n">2</span></h2>
    <div class="tr-rows">
      <div class="act-row"><div class="act-in">
        <div class="act-main" role="button" tabindex="0"><b class="act-verb">Léa Martin</b><span class="act-sub"><span>Je serai en retard demain, mon train est supprimé.</span></span></div>
      </div></div>
      <div class="act-row"><div class="act-in">
        <div class="act-main" role="button" tabindex="0"><b class="act-verb">Centre Exemple</b><span class="act-sub"><span>Les conventions partent jeudi.</span></span></div>
      </div></div>
    </div>
  </section>
</div>

<div class="page-inner page-wide ol-poste">
  <div class="td-head"><h1>Aujourd’hui</h1><div class="td-date">lundi 16&nbsp;novembre</div></div>
  <div class="board td-board">
    <section class="bcol">
      <h2 class="bcol-h"><i data-ic="check" data-t="ic-14"></i> Présence</h2>
      <div class="bcol-rows">
        <div class="ol-carte">
          <div class="ol-carte-t">BTS SIO 2, matin</div>
          <div class="act-sub"><span>9&nbsp;h à 12&nbsp;h&nbsp;30</span><span>18&nbsp;apprenants</span></div>
          <button class="btn btn-primary"><i data-ic="qr-code" data-t="ic-14"></i> Lancer l’appel</button>
        </div>
      </div>
    </section>
    <section class="bcol">
      <h2 class="bcol-h"><i data-ic="clipboard-note" data-t="ic-14"></i> Absences et demandes <span class="tr-n">2</span></h2>
      <div class="bcol-rows">
        <div class="act-row"><div class="act-in">
          <div class="act-main" role="button" tabindex="0"><b class="act-verb">Hugo Lefèvre</b><span class="act-sub"><span>absent ven.&nbsp;13/11, après-midi</span><span>apprenti</span></span></div>
          <div class="act-btns"><button class="abtn" aria-label="Prévenir son entreprise"><i data-ic="mail"></i></button></div>
        </div></div>
        <div class="act-row"><div class="act-in">
          <div class="act-main" role="button" tabindex="0"><b class="act-verb">Convention de stage</b><span class="act-sub"><span>13&nbsp;sur 18 faites</span><span>avant ven.&nbsp;20/11</span></span></div>
          <div class="act-btns"><button class="abtn" aria-label="Relancer"><i data-ic="bell-ring"></i></button></div>
        </div></div>
      </div>
    </section>
    <section class="bcol">
      <h2 class="bcol-h"><i data-ic="message-text" data-t="ic-14"></i> Messages <span class="tr-n">2</span></h2>
      <div class="bcol-rows">
        <div class="act-row"><div class="act-in">
          <div class="act-main" role="button" tabindex="0"><b class="act-verb">Léa Martin</b><span class="act-sub"><span>Je serai en retard demain, mon train est supprimé.</span></span></div>
        </div></div>
        <div class="act-row"><div class="act-in">
          <div class="act-main" role="button" tabindex="0"><b class="act-verb">Centre Exemple</b><span class="act-sub"><span>Les conventions partent jeudi.</span></span></div>
        </div></div>
      </div>
    </section>
  </div>
</div>
</template>
<script src="../coque.js"></script>
</body>
</html>
